name: Publish connector installer

on:
  push:
    tags:
      - "connect-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @buzzrouter/connect
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: |
          npm test -- packages/connect/src/installer.test.js
          npm pack --dry-run --workspace @buzzrouter/connect

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/connect-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const packageJson = require("./packages/connect/package.json");
            const expected = `connect-v${packageJson.version}`;
            if (process.env.RELEASE_TAG !== expected) {
              console.error(`Expected tag ${expected}.`);
              process.exit(1);
            }
          '

      - name: Publish package
        if: startsWith(github.ref, 'refs/tags/connect-v')
        run: npm publish --workspace @buzzrouter/connect --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
