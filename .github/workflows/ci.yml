name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_SSL: "false"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/buzzrouter_ci
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/buzzrouter_ci
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: buzzrouter_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buzzrouter_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The browser download is the single most expensive step in CI (~30s of a
      # ~130s run) and changes only when the Playwright dependency does, so key
      # the cache on its exact locked version. On a hit, skip the install
      # entirely: ubuntu-latest already ships the shared libraries chromium
      # needs, so `--with-deps` (an apt-get run) is only worth paying on a miss.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Test shared-channel workflow
        run: npm run test:e2e

      - name: Package Pages artifact
        run: bash scripts/package-pages.sh /tmp/buzzrouter-pages
