app = "buzzrouter"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_SSL = "false"
  DISCOVERY_GITHUB_ENABLED = "false"
  DISCOVERY_NIP65_ENABLED = "false"
  DISCOVERY_NIP66_ENABLED = "false"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  PORT = "3000"
  PUBLIC_APP_ORIGIN = "https://buzzrouter.com"

[processes]
  web = "npm start -- --hostname 0.0.0.0 --port 3000"

[deploy]
  release_command = "npm run db:migrate"
  strategy = "rolling"

[http_service]
  processes = ["web"]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  processes = ["web"]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

[[restart]]
  processes = ["web"]
  policy = "on-failure"
  retries = 10
