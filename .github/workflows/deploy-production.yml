name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATABASE_SSL: "false"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/buzzrouter_ci
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: buzzrouter_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d buzzrouter_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    name: Package static site
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
    permissions:
      contents: read
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build Pages artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s public/prototype.html
          install -D -m 0644 public/prototype.html _site/index.html
          test "$(find _site -type f | wc -l)" -eq 1
          echo "sha256=$(sha256sum _site/index.html | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          curl \
            --fail \
            --location \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 20 \
            --output "${body}" \
            "${DEPLOYMENT_URL}?release=${GITHUB_SHA}"
          test "$(sha256sum "${body}" | cut -d ' ' -f 1)" = "${EXPECTED_SHA256}"
